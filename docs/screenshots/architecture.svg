<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4f8cff"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa7b5"/>
    </marker>
    <style>
      .box{fill:#161b22;stroke:#2a3647;stroke-width:1.5;rx:12;}
      .accent{stroke:#4f8cff;}
      .t{fill:#e6edf3;font-size:14px;font-weight:600;}
      .s{fill:#9aa7b5;font-size:11px;}
      .lbl{fill:#9aa7b5;font-size:11px;}
      .src{fill:#1b2430;stroke:#2a3647;stroke-width:1.2;rx:8;}
      .srcT{fill:#cdd7e2;font-size:11px;}
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="420" fill="#0d1117"/>
  <text x="24" y="34" class="t" font-size="16">Inbound Ops Dashboard — Architecture</text>
  <text x="24" y="54" class="s">Sanitized overview · all sources abstracted</text>

  <!-- Manager -->
  <rect class="box" x="40" y="150" width="120" height="70" rx="12"/>
  <text x="100" y="180" text-anchor="middle" class="t">Manager</text>
  <text x="100" y="200" text-anchor="middle" class="s">one click</text>

  <!-- Dashboard -->
  <rect class="box accent" x="230" y="120" width="220" height="130" rx="12"/>
  <text x="340" y="150" text-anchor="middle" class="t">Dashboard</text>
  <text x="340" y="170" text-anchor="middle" class="s">HTML / CSS / JS</text>
  <text x="340" y="192" text-anchor="middle" class="s">• interval picker</text>
  <text x="340" y="210" text-anchor="middle" class="s">• client-side joins</text>
  <text x="340" y="228" text-anchor="middle" class="s">• grid · KPIs · rankings</text>

  <!-- Proxy -->
  <rect class="box" x="520" y="120" width="220" height="130" rx="12"/>
  <text x="630" y="150" text-anchor="middle" class="t">Auth data proxy</text>
  <text x="630" y="170" text-anchor="middle" class="s">browser userscript</text>
  <text x="630" y="192" text-anchor="middle" class="s">• bypasses CORS</text>
  <text x="630" y="210" text-anchor="middle" class="s">• forwards auth session</text>
  <text x="630" y="228" text-anchor="middle" class="s">(kept private)</text>

  <!-- Sources -->
  <rect class="src" x="520" y="320" width="100" height="34" rx="8"/>
  <text x="570" y="342" text-anchor="middle" class="srcT">workforce</text>
  <rect class="src" x="630" y="320" width="100" height="34" rx="8"/>
  <text x="680" y="342" text-anchor="middle" class="srcT">labor</text>
  <rect class="src" x="520" y="364" width="100" height="34" rx="8"/>
  <text x="570" y="386" text-anchor="middle" class="srcT">quality</text>
  <rect class="src" x="630" y="364" width="100" height="34" rx="8"/>
  <text x="680" y="386" text-anchor="middle" class="srcT">andon / presence</text>

  <!-- Arrows -->
  <line x1="160" y1="185" x2="226" y2="185" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="178" x2="516" y2="178" stroke="#4f8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="516" y1="198" x2="452" y2="198" stroke="#9aa7b5" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="484" y="170" text-anchor="middle" class="lbl">fetch</text>
  <text x="484" y="216" text-anchor="middle" class="lbl">data</text>
  <line x1="630" y1="250" x2="630" y2="316" stroke="#9aa7b5" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="648" y="286" class="lbl">pulls live data</text>
</svg>
